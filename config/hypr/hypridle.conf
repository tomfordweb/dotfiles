# hypridle — idle blanking and lock.
#
# The wake path deliberately does NOT stop at a bare dpms on. An output can
# come back with its CRTC released (DRM: status=connected, enabled=disabled),
# and no amount of dpms revives that — on minerva the two DisplayPort monitors
# sat dark through repeated dpms calls until a real modeset ran, and before
# that the only cure was a KVM switch away and back. hypr-dpms-wake escalates
# to that modeset. Per-output dpms is not an option: Hyprland 0.56's Lua
# dispatcher ignores the monitor argument.
# Commands run through /bin/sh, so $HOME expands.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $HOME/code/tomfordweb/dotfiles/bin/hypr-dpms-wake
}

# Lock only. The DPMS-off listener is DISABLED 2026-11-07: twice today the
# `hl.dsp.dpms("off")` dispatch killed Hyprland 0.56.0 outright (every client
# lost its socket, hyprlock aborted with "Disconnected from pollfd id 0", the
# watchdog came back in safe mode). The second time it fired 30s AFTER the
# lock had settled, so it is the blank itself, not a race with hyprlock.
# Nothing in this file changed before it started; what changed that day was
# the NVIDIA driver (595.45.04 -> 615.78.08) and kernel 6.12.114 -> .115.
# Blanking worked under 595 since September. Re-enable once the driver or
# Hyprland is updated and `hyprctl dispatch 'hl.dsp.dpms("off")'` has been
# tested by hand on a session with nothing open. Lock-screen monitors stay
# on until then. See beads dotfiles-0f4.
listener {
    timeout = 3600 # 1 hour — lock the session
    on-timeout = loginctl lock-session
}

