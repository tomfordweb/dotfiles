# GENERATED by bin/rice-build. Edit rice/templates/yazi-theme.toml.tmpl
# and rice/palette.json, then rebuild.

[mgr]
cwd = { fg = "#22d3ee", bold = true }
border_symbol = "┃"
border_style = { fg = "#585b70" }

# Only the current directory gets the bright selection bar.
# Explicitly disable Yazi's default reverse/underline styles when merging.
[indicator]
current = { fg = "#11111b", bg = "#cba6f7", bold = true, reversed = false }
parent = { fg = "#a6adc8", bg = "#29293a", bold = false, reversed = false }
preview = { fg = "#a6adc8", bg = "#29293a", bold = false, underline = false, reversed = false }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#11111b", bg = "#cba6f7", bold = true }
inactive = { fg = "#a6adc8", bg = "#29293a", bold = false }
